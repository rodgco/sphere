name: Release

on:
  # Run only after CI has passed for a push to master. A failing CI must not publish.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  # Lets you publish the version already committed (the first release, or a retry after a failed
  # run) without an empty commit. The release job still runs its own build, tests and e2e.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # `workflow_run` fires for failed CI too; only publish a successful push, or an explicit
    # manual dispatch.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # npm provenance via OIDC
    steps:
      - uses: actions/checkout@v4
        with:
          # `workflow_run` checks out the SHA CI gated, not whatever master points at now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install --global npm@latest
      - run: npm --version

      - run: npm ci

      # The Kit fixture consumes the built package through a `file:` link.
      - run: npm --prefix fixtures/kit ci

      # CI has already gated this SHA, but a manual dispatch has not: run the same build/test/e2e
      # gate here too, so neither path can publish an untested tree.
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

      # Publishing is opt-in through a repository *variable* (`gh variable set NPM_PUBLISH --body
      # true`), so a clone without trusted publishing configured stays green instead of failing on
      # every push. Authentication is OIDC trusted publishing; no npm token is read or stored.
      # `changeset publish` (not bare `npm publish`) is what creates the git tag and lets the
      # action create the GitHub release from the changelog; npm publish alone leaves both behind.
      # Provenance comes from the env var, because changeset shells out to npm itself.
      - uses: changesets/action@v1
        if: vars.NPM_PUBLISH == 'true'
        with:
          publish: npx changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
