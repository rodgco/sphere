name: Release

on:
  push:
    branches: [master]
  # Lets you publish the version already committed (the first release, or a retry after a failed
  # run) without an empty commit.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    permissions:
      contents: write
      id-token: write # npm provenance via OIDC
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # The Kit fixture consumes the built package through a `file:` link.
      - run: npm --prefix fixtures/kit ci

      # One dev server per test, real browsers, and the built artifact — the same gate as CI.
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

      # Without the secret the job stays green and skips: a red X on every push for a missing
      # publish credential trains people to ignore the workflow.
      - uses: changesets/action@v1
        if: env.NPM_TOKEN != ''
        with:
          publish: npm publish --provenance --access public
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
